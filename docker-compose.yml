version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-linkfox}
      - REDIS_URL=redis://redis:6379/0
      - LINKFOX_API_KEY=${LINKFOX_API_KEY}
      - LINKFOX_API_BASE=${LINKFOX_API_BASE:-https://sbappstoreapi.ziniao.com/openapi-router}
      - MAX_CONCURRENT_TASKS=3
      - POLL_INTERVAL=5
      - MAX_RETRIES=3
      - TASK_TIMEOUT_MINUTES=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.workers.task_worker.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-linkfox}
      - REDIS_URL=redis://redis:6379/0
      - LINKFOX_API_KEY=${LINKFOX_API_KEY}
      - LINKFOX_API_BASE=${LINKFOX_API_BASE:-https://sbappstoreapi.ziniao.com/openapi-router}
      - MAX_CONCURRENT_TASKS=3
      - POLL_INTERVAL=5
      - MAX_RETRIES=3
      - TASK_TIMEOUT_MINUTES=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_DB=${POSTGRES_DB:-linkfox}
    volumes:
      - linkfox_pg_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d linkfox"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - linkfox_redis_data:/data
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  linkfox_pg_data:
  linkfox_redis_data: